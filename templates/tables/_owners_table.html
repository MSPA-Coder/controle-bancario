{% load icons i18n %}
{# Depois de uma escrita (`tabelaAtualizar`), o corpo da tabela se recarrega com o filtro VIVO da tela. #}
<tbody id="ownersTableBody" hx-trigger="tabelaAtualizar from:body" hx-get="{{ request.path }}" hx-include="[data-table-filter]" hx-target="this" hx-swap="outerHTML">
{% for owner in owners %}
    <tr>
        <td>{{ owner.name }}</td>
        <td class="actions">
            <button type="button" class="btn btn-sm btn-icon btn-action-edit" title="{% trans 'Editar' %}" data-toggle-edit="edit-owner-{{ owner.id }}">{% icon 'edit' %}</button>
            <form method="post" data-cadastro-htmx="#ownersTableBody" action="{% url 'accounts:delete_owner' owner.id %}" data-ui="inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-sm btn-icon btn-action-delete" title="{% trans 'Excluir' %}"
                    data-sa-confirmar="{% blocktrans trimmed with nome=owner.name %}Excluir o titular {{ nome }}? Esta ação não pode ser desfeita.{% endblocktrans %}"
                    data-sa-titulo="{% trans 'Excluir titular' %}"
                    data-sa-severidade="error"
                    data-sa-ok="{% trans 'Excluir' %}">{% icon 'delete' %}</button>
            </form>
        </td>
    </tr>
    <tr id="edit-owner-{{ owner.id }}" class="edit-row">
        <td colspan="2">
            <form method="post" data-cadastro-htmx="#ownersTableBody" action="{% url 'accounts:update_owner' owner.id %}" class="edit-form">
                {% csrf_token %}
                <input type="text" name="name" value="{{ owner.name }}" aria-label="{% trans 'Nome do titular' %}" required maxlength="100" data-ui="flex-1">
                <button type="submit" class="btn btn-primary btn-sm"
                        data-sa-confirmar="{% trans 'Salvar as alterações deste titular?' %}"
                        data-sa-titulo="{% trans 'Confirmar alteração' %}"
                        data-sa-severidade="info"
                        data-sa-ok="{% trans 'Salvar' %}">{% icon 'save' %}<span>{% trans "Salvar" %}</span></button>
            </form>
        </td>
    </tr>
{% empty %}
    <tr>
        <td colspan="2" class="empty-state">{% trans "Nenhum titular cadastrado." %}</td>
    </tr>
{% endfor %}
</tbody>
