name: security-scanner

services:
  workflow-lint:
    image: rhysd/actionlint:1.7.12
    pull_policy: always
    entrypoint: [actionlint]
    command: [ci.yml, browser.yml]
    working_dir: /workflows
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    volumes:
      - ./workflows:/workflows:ro

  trivy:
    image: aquasec/trivy:0.75.0
    pull_policy: always
    entrypoint: ["trivy"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    tmpfs:
      # The Trivy vulnerability database needs room to unpack in /tmp.
      - /tmp:rw,noexec,nosuid,size=1g
    volumes:
      - type: bind
        source: ${RUNNER_TEMP:?RUNNER_TEMP must be set}
        target: /varredura
        read_only: true
      - type: bind
        source: ${RUNNER_TEMP:?RUNNER_TEMP must be set}/trivy-cache
        target: /tmp/trivy-cache
